<div class="dashboard-page">

  <!-- HEADER -->
  <div class="dashboard-heading">
    <div>
      <span class="eyebrow">OVERVIEW</span>
      <h1>Budget Utilization Dashboard</h1>
      <p>
        Monitor government budgets, expenditures and financial alerts.
      </p>
    </div>

    <div class="dashboard-status">
      <span class="status-dot"></span>
      System Active
    </div>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="loading-card">
    <div class="loader"></div>
    <span>Loading dashboard...</span>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="message error">
    {{ error }}
  </div>

  <!-- DASHBOARD DATA -->
  <ng-container *ngIf="data">

    <!-- SUMMARY CARDS -->
    <div class="stats-grid">

      <!-- Baaki dashboard cards yahan aayenge -->

    </div>

  </ng-container>

</div>
